<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Загрузка...</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { 
            --bg: #09090b; 
            --surface: #18181b; 
            --surface-hover: #27272a;
            --text: #fafafa; 
            --text-muted: #a1a1aa; 
            --accent: #3b82f6; 
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            --gold: #fbbf24;
            --danger: #ef4444;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
        }
        
        * {
            box-sizing: border-box; margin: 0; padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: var(--bg); color: var(--text); 
            padding-bottom: 100px; overflow-x: hidden;
            line-height: 1.5; font-size: 15px;
        }

        /* Скелетон-загрузка */
        .skeleton { background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius-md); }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        #skeleton-loader { padding: 20px; }
        .skel-poster { width: 100%; height: 60vh; margin-bottom: 20px; border-radius: var(--radius-lg); }
        .skel-title { width: 60%; height: 40px; margin-bottom: 12px; }
        .skel-text { width: 100%; height: 20px; margin-bottom: 8px; }

        #app-content { display: none; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Кнопка закрытия */
        .top-close-btn { 
            position: fixed; top: 20px; right: 20px; z-index: 100; 
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15); 
            width: 36px; height: 36px; border-radius: 50%; color: white; font-size: 16px; 
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: transform 0.2s;
        }
        .top-close-btn:active { transform: scale(0.9); }

        /* Постер (Hero) */
        .hero-container {
            position: relative;
            width: 100%;
            height: 65vh; /* Большой постер */
            max-height: 600px;
            overflow: hidden;
        }
        .hero-img {
            width: 100%; height: 100%; object-fit: cover; object-position: top center;
            mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
        }
        
        .content { padding: 0 20px 20px 20px; margin-top: -60px; position: relative; z-index: 10; }

        /* Заголовки */
        .title { font-size: 32px; font-weight: 800; line-height: 1.15; letter-spacing: -0.5px; margin-bottom: 6px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .original-title { color: var(--text-muted); font-size: 15px; font-weight: 500; margin-bottom: 12px; }
        .tagline { color: var(--text-muted); font-size: 15px; font-style: italic; margin-bottom: 16px; opacity: 0.8; }

        /* Бейджи */
        .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
        .badge { 
            background: var(--surface); padding: 6px 12px; border-radius: var(--radius-sm); 
            font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .badge.gold { color: var(--gold); }
        .badge.red { color: #f87171; }

        /* Сетка кнопок действий */
        .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; }
        .action-btn { 
            background: var(--surface); border: 1px solid rgba(255,255,255,0.05); color: var(--text);
            padding: 12px 8px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            cursor: pointer; transition: all 0.2s;
        }
        .action-btn:active { background: var(--surface-hover); transform: scale(0.96); }
        .action-btn.active { background: rgba(251, 191, 36, 0.15); border-color: rgba(251, 191, 36, 0.3); color: var(--gold); }
        .action-btn span { font-size: 22px; }

        /* Информационный блок */
        .info-card { 
            background: var(--surface); border-radius: var(--radius-lg); padding: 20px; 
            margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.03);
        }
        .info-row { display: flex; margin-bottom: 14px; font-size: 14px; align-items: flex-start; }
        .info-row:last-child { margin-bottom: 0; }
        .info-label { color: var(--text-muted); width: 100px; flex-shrink: 0; font-weight: 500; }
        .info-value { color: var(--text); flex: 1; font-weight: 500; }

        /* Заголовки секций */
        .section { margin-bottom: 35px; display: none; }
        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        /* Описание */
        .desc { font-size: 15px; line-height: 1.6; color: #d4d4d8; }
        .desc.collapsed { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
        .read-more { color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 8px; display: inline-block; }

        /* Карусели (Кадры, Похожие) */
        .carousel { 
            display: flex; overflow-x: auto; gap: 12px; 
            scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px;
        }
        .carousel::-webkit-scrollbar { display: none; }
        
        .backdrop-img { height: 160px; border-radius: var(--radius-md); scroll-snap-align: start; object-fit: cover; }
        
        .similar-card { width: 120px; flex-shrink: 0; scroll-snap-align: start; cursor: pointer; transition: transform 0.2s; }
        .similar-card:active { transform: scale(0.95); }
        .similar-card img { width: 100%; aspect-ratio: 2/3; border-radius: var(--radius-sm); margin-bottom: 8px; object-fit: cover; background: var(--surface); }
        .similar-card .title { font-size: 13px; font-weight: 600; line-height: 1.2; margin-bottom: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .similar-card .year { font-size: 12px; color: var(--text-muted); }

        /* Сетка сезонов */
        .seasons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
        .season-card { 
            background: var(--surface); padding: 16px 12px; border-radius: var(--radius-md); text-align: center; 
            border: 1px solid rgba(255,255,255,0.03);
        }
        .season-card .num { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
        .season-card .eps { font-size: 12px; color: var(--text-muted); font-weight: 500; }

        /* Стриминги */
        .providers-flex { display: flex; gap: 12px; flex-wrap: wrap; }
        .provider-logo { width: 52px; height: 52px; border-radius: var(--radius-md); object-fit: cover; }

        /* Плашка "Нет в базе" */
        #not-in-base { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 24px; color: #fca5a5; display: none; }

        /* Трейлер */
        .trailer-box { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: var(--radius-lg); border: 1px solid rgba(255,255,255,0.05); }
        .trailer-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* Фиксированная кнопка снизу */
        .fixed-bottom { 
            position: fixed; bottom: 0; left: 0; right: 0; padding: 16px 20px; 
            background: linear-gradient(to top, var(--bg) 60%, transparent); z-index: 9999;
        }
        .btn-watch { 
            width: 100%; padding: 18px; background: var(--accent-gradient); color: white; 
            border: none; border-radius: var(--radius-md); font-size: 16px; font-weight: 700; 
            display: flex; justify-content: center; align-items: center; gap: 10px; 
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3); cursor: pointer; transition: transform 0.2s;
        }
        .btn-watch:active { transform: scale(0.97); }

        /* Плавная загрузка картинок */
        img { opacity: 0; transition: opacity 0.4s ease; }
        img.loaded { opacity: 1; }
    </style>
</head>
<body>

    <button class="top-close-btn" onclick="closeApp()">✕</button>

    <div id="skeleton-loader">
        <div class="skeleton skel-poster"></div>
        <div class="skeleton skel-title"></div>
        <div class="skeleton skel-text"></div>
        <div class="skeleton skel-text" style="width: 80%;"></div>
    </div>

    <div id="app-content">
        <div class="hero-container">
            <img id="poster" class="hero-img" src="" alt="Постер">
        </div>
        
        <div class="content">
            <div id="title" class="title"></div>
            <div id="originalTitle" class="original-title"></div>
            <div id="tagline" class="tagline"></div>

            <div class="badges" id="badges-container"></div>

            <div id="not-in-base">
                ❌ <b>Этого фильма нет в нашей базе.</b><br>
                <span style="font-size:13px; opacity:0.8;">Нажмите «Оставить заявку» внизу, и мы постараемся его добавить.</span>
            </div>

            <div class="action-grid" id="action-row">
                <button class="action-btn" onclick="shareLink()"><span>📤</span>Поделиться</button>
                <button id="watchlist-btn" class="action-btn" onclick="toggleWatchlist()"><span>📌</span>В список</button>
                <button id="notify-btn" class="action-btn" onclick="toggleNotify()"><span>🔔</span>Уведомления</button>
            </div>

            <div class="info-card" id="info-box">
                <div class="info-row"><div class="info-label">Страна</div><div id="country" class="info-value"></div></div>
                <div class="info-row"><div class="info-label">Жанры</div><div id="genres" class="info-value"></div></div>
                <div class="info-row" id="director-row"><div class="info-label">Создатели</div><div id="director" class="info-value"></div></div>
                <div class="info-row" id="cast-row"><div class="info-label">В ролях</div><div id="cast" class="info-value"></div></div>
                <div class="info-row" id="companies-row"><div class="info-label">Студии</div><div id="companies" class="info-value"></div></div>
            </div>

            <!-- Блок "О фильме" всегда показывается -->
            <div class="section" style="display: block;">
                <div class="section-title">📝 О фильме</div>
                <div id="description" class="desc collapsed"></div>
                <span id="readMoreBtn" class="read-more" onclick="toggleReadMore()">Читать далее</span>
            </div>

            <!-- Умные секции (скроются, если нет данных) -->
            <div id="providers-section" class="section">
                <div class="section-title">Где смотреть</div>
                <div id="providers" class="providers-flex"></div>
            </div>

            <div id="backdrops-section" class="section">
                <div class="section-title">📸 Кадры</div>
                <div id="backdrops" class="carousel"></div>
            </div>

            <div id="seasons-section" class="section">
                <div class="section-title">📺 Сезоны</div>
                <div id="seasons" class="seasons-grid"></div>
            </div>

            <div id="trailer-section" class="section">
                <div class="section-title">▶️ Трейлер</div>
                <div class="trailer-box">
                    <iframe id="trailer-iframe" src="" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <div id="similar-section" class="section">
                <div class="section-title">🎬 Похожие</div>
                <div id="similar" class="carousel"></div>
            </div>
        </div>

        <div class="fixed-bottom">
            <button type="button" id="main-action-btn" class="btn-watch" onclick="openInBot()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Смотреть в боте
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.querySelectorAll('img').forEach(img => {
            img.onload = () => img.classList.add('loaded');
        });

        const urlParams = new URLSearchParams(window.location.search);
        const rowIndex = urlParams.get('rowIndex');
        const type = urlParams.get('type') || 'movie';
        const API_URL = urlParams.get('api') || "https://script.google.com/macros/s/AKfycbznYiEClrr5hBugCfF4TEGE5upb_uQJaxIbItsQklybzJ3B1ElAaxgC3mQ7dW1VbD28qA/exec";
        const userId = tg.initDataUnsafe?.user?.id || urlParams.get('uid') || "0";

        let isInWatchlist = false;
        let isMuted = false;
        let botUsername = urlParams.get('bot') || "katxlog_bot";
        let currentTmdb = null; 

        async function loadBasic() {
            try {
                const res = await fetch(`${API_URL}?action=basic&rowIndex=${rowIndex}&type=${type}&userId=${userId}&_t=${Date.now()}`);
                const data = await res.json();
                
                if (!data.ok) throw new Error(data.error || "Unknown error");

                document.title = data.title;
                
                const defaultImg = 'https://via.placeholder.com/500x750?text=No+Poster';
                document.getElementById('poster').src = data.poster || defaultImg;
                document.getElementById('title').textContent = data.title;
                
                let badgesHtml = `<span class="badge">${type === 'movie' ? '🍿 Фильм' : '📺 Сериал'}</span>`;
                if (data.year) badgesHtml += `<span class="badge">📅 ${data.year}</span>`;
                if (data.ratingTMDB) badgesHtml += `<span class="badge gold">⭐ TMDB: ${data.ratingTMDB}</span>`;
                if (data.ratingKP) badgesHtml += `<span class="badge red">⭐ КП: ${data.ratingKP}</span>`;
                document.getElementById('badges-container').innerHTML = badgesHtml;

                document.getElementById('country').textContent = data.country || "—";
                document.getElementById('genres').textContent = data.genres || "—";
                
                if (data.description) {
                    document.getElementById('description').textContent = data.description;
                } else {
                    document.getElementById('description').style.display = 'none';
                    document.getElementById('readMoreBtn').style.display = 'none';
                }

                if (data.trailer) {
                    document.getElementById('trailer-section').style.display = 'block';
                    const vidId = data.trailer.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&]{11})/);
                    if (vidId && vidId[1]) {
                        document.getElementById('trailer-iframe').src = `https://www.youtube.com/embed/${vidId[1]}`;
                    }
                }

                if (!urlParams.get('bot') && data.botUsername) botUsername = data.botUsername;
                
                isInWatchlist = !!data.inWatchlist;
                isMuted = !!data.isMuted;
                
                updateWatchlistUI();
                updateNotifyUI();

                document.getElementById('action-row').style.display = 'grid';
                document.getElementById('not-in-base').style.display = 'none';
                
                const bottomBtn = document.getElementById('main-action-btn');
                bottomBtn.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> Смотреть в боте`;
                bottomBtn.onclick = openInBot;
                bottomBtn.style.background = 'var(--accent-gradient)'; 

                document.getElementById('skeleton-loader').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';

                loadExtended();

            } catch (e) {
                console.error("loadBasic error:", e);
                tg.showAlert("Ошибка загрузки: " + e.message);
            }
        }

        async function loadExtended() {
            try {
                const res = await fetch(`${API_URL}?action=tmdb&rowIndex=${rowIndex}&type=${type}&_t=${Date.now()}`);
                const d = await res.json();
                if (!d.ok) return;

                if (d.originalTitle) document.getElementById('originalTitle').textContent = d.originalTitle;
                if (d.tagline) document.getElementById('tagline').textContent = `«${d.tagline}»`;

                let badgesHtml = document.getElementById('badges-container').innerHTML;
                if (d.status) {
                    let st = d.status === "Ended" ? "Завершен" : d.status === "Returning Series" ? "Идет показ" : d.status;
                    badgesHtml += `<span class="badge">🚦 ${st}</span>`;
                }
                if (d.runtime > 0) {
                    let h = Math.floor(d.runtime / 60); let m = d.runtime % 60;
                    let timeStr = h > 0 ? `${h} ч ${m} мин` : `${m} мин`;
                    badgesHtml += `<span class="badge">⏱ ${timeStr}</span>`;
                }
                if (d.ageRating) badgesHtml += `<span class="badge red">${d.ageRating}</span>`;
                if (d.premiereWorld) {
                    let date = new Date(d.premiereWorld).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
                    badgesHtml += `<span class="badge">📅 ${date}</span>`;
                }
                document.getElementById('badges-container').innerHTML = badgesHtml;

                // Умное скрытие пустых строк
                if (d.director) document.getElementById('director').textContent = d.director;
                else document.getElementById('director-row').style.display = 'none';

                if (d.cast) document.getElementById('cast').textContent = d.cast;
                else document.getElementById('cast-row').style.display = 'none';

                if (d.companies && d.companies.length > 0) {
                    document.getElementById('companies').textContent = d.companies.join(', ');
                } else {
                    document.getElementById('companies-row').style.display = 'none';
                }

                // 🚀 УМНЫЕ СЕКЦИИ (скрываем заголовок, если нет контента)
                if (d.watchProviders && d.watchProviders.length > 0) {
                    document.getElementById('providers-section').style.display = 'block';
                    document.getElementById('providers').innerHTML = d.watchProviders.map(p => 
                        `<img src="${p.logo}" class="provider-logo" title="${p.name}" alt="${p.name}">`
                    ).join('');
                }

                if (d.backdrops && d.backdrops.length > 0) {
                    document.getElementById('backdrops-section').style.display = 'block';
                    document.getElementById('backdrops').innerHTML = d.backdrops.map(b => 
                        `<img src="${b}" class="backdrop-img">`
                    ).join('');
                }

                if (type === 'series' && d.seasons && d.seasons.length > 0) {
                    document.getElementById('seasons-section').style.display = 'block';
                    document.getElementById('seasons').innerHTML = d.seasons.map(s => 
                        `<div class="season-card"><div class="num">Сезон ${s.num}</div><div class="eps">${s.episodes} сер.</div></div>`
                    ).join('');
                }

                if (d.similar && d.similar.length > 0) {
                    document.getElementById('similar-section').style.display = 'block';
                    document.getElementById('similar').innerHTML = d.similar.map(m => {
                        const safeTitle = String(m.title || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        return `<div class="similar-card" onclick="openSimilar('${m.id}', '${m.kind}', ${m.rowIndex || 0}, '${safeTitle}', '${m.year || ''}')">
                            <img src="${m.poster}">
                            <div class="title">${m.title}</div>
                            <div class="year">${m.year}</div>
                        </div>`;
                    }).join('');
                }
            } catch (e) {
                console.error("loadExtended error:", e);
            }
        }

        function toggleReadMore() {
            const desc = document.getElementById('description');
            const btn = document.getElementById('readMoreBtn');
            if (desc.classList.contains('collapsed')) {
                desc.classList.remove('collapsed');
                btn.textContent = 'Скрыть';
            } else {
                desc.classList.add('collapsed');
                btn.textContent = 'Читать далее';
            }
        }

        function updateWatchlistUI() {
            const btn = document.getElementById('watchlist-btn');
            if (isInWatchlist) { btn.classList.add('active'); btn.innerHTML = '<span>✅</span>В списке'; }
            else { btn.classList.remove('active'); btn.innerHTML = '<span>📌</span>В список'; }
        }

        function updateNotifyUI() {
            const btn = document.getElementById('notify-btn');
            if (isMuted) { btn.classList.remove('active'); btn.innerHTML = '<span>🔕</span>Выкл.'; }
            else { btn.classList.add('active'); btn.innerHTML = '<span>🔔</span>Увед.'; }
        }

        async function toggleWatchlist() {
            const btn = document.getElementById('watchlist-btn');
            if (!userId || userId === "0") { tg.showAlert("❌ Не удалось определить ваш Telegram ID."); return; }
            btn.disabled = true; btn.style.opacity = '0.5';
            try { tg.HapticFeedback?.impactOccurred('light'); } catch(e) {}
            try {
                const newState = !isInWatchlist ? 1 : 0;
                const url = `${API_URL}?action=set_watch&userId=${encodeURIComponent(userId)}&rowIndex=${encodeURIComponent(rowIndex)}&type=${encodeURIComponent(type)}&state=${newState}&_t=${Date.now()}`;
                const res = await fetch(url);
                const data = JSON.parse(await res.text());
                if (data.ok) {
                    isInWatchlist = !!data.inWatchlist;
                    updateWatchlistUI();
                    try { tg.HapticFeedback?.notificationOccurred(isInWatchlist ? 'success' : 'warning'); } catch(e) {}
                } else throw new Error(data.error || "Ошибка");
            } catch (e) { tg.showAlert("❌ Ошибка: " + e.message); }
            finally { btn.disabled = false; btn.style.opacity = '1'; }
        }

        async function toggleNotify() {
            const btn = document.getElementById('notify-btn');
            if (!userId || userId === "0") { tg.showAlert("❌ Не удалось определить ваш Telegram ID."); return; }
            btn.disabled = true; btn.style.opacity = '0.5';
            try { tg.HapticFeedback?.impactOccurred('light'); } catch(e) {}
            try {
                const newState = !isMuted ? 1 : 0;
                const url = `${API_URL}?action=toggle_notify&userId=${encodeURIComponent(userId)}&rowIndex=${encodeURIComponent(rowIndex)}&type=${encodeURIComponent(type)}&state=${newState}&_t=${Date.now()}`;
                const res = await fetch(url);
                const data = JSON.parse(await res.text());
                if (data.ok) {
                    isMuted = !!data.muted;
                    updateNotifyUI();
                    try { tg.HapticFeedback?.notificationOccurred('success'); } catch(e) {}
                } else throw new Error(data.error || "Ошибка");
            } catch (e) { tg.showAlert("❌ Ошибка: " + e.message); }
            finally { btn.disabled = false; btn.style.opacity = '1'; }
        }

        function shareLink() {
            try {
                try { tg.HapticFeedback?.impactOccurred('light'); } catch(e) {}
                let cleanBotName = String(botUsername).replace('@', '').trim() || "katxlog_bot";
                let startParam = type === 'movie' ? `open_movie_${rowIndex}` : `open_${rowIndex}`;
                let botLink = `https://t.me/${cleanBotName}?start=${startParam}`;
                let title = document.getElementById('title').textContent;
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(botLink)}&text=${encodeURIComponent("Смотри: " + title)}`);
            } catch (e) { tg.showAlert("Ошибка: " + e.message); }
        }

        function openInBot() {
            try {
                let cleanBotName = String(botUsername).replace('@', '').trim() || "katxlog_bot";
                let startParam = type === 'movie' ? `play_movie_${rowIndex}` : `play_${rowIndex}`;
                tg.openTelegramLink(`https://t.me/${cleanBotName}?start=${startParam}`);
            } catch (e) { tg.showAlert("Ошибка: " + e.message); }
        }

        function openSimilar(id, kind, localRow, title, year) {
            try { tg.HapticFeedback?.selectionChanged(); } catch (e) {}
            if (localRow && localRow > 0) {
                const newType = kind === 'm' ? 'movie' : 'series';
                window.location.search = `?rowIndex=${localRow}&type=${newType}`;
            } else {
                loadTmdbCard(id, kind, title, year);
            }
        }

        function showRequestButton() {
            const btn = document.getElementById('main-action-btn');
            btn.disabled = false;
            btn.innerHTML = '📩 Оставить заявку';
            btn.onclick = requestMovie;
        }

        async function loadTmdbCard(id, kind, title, year) {
            currentTmdb = { id, kind, title, year, countryRaw: "" };
            window.scrollTo(0, 0);

            document.getElementById('title').textContent = title;
            document.getElementById('originalTitle').textContent = '';
            document.getElementById('tagline').textContent = '';
            document.getElementById('poster').src = '';
            document.getElementById('badges-container').innerHTML = `<span class="badge">⏳ Загрузка...</span>`;
            document.getElementById('description').textContent = 'Загрузка описания...';
            document.getElementById('description').style.display = 'block';
            document.getElementById('readMoreBtn').style.display = 'none';
            document.getElementById('country').textContent = "—";
            document.getElementById('genres').textContent = "—";
            ['director-row', 'cast-row', 'companies-row'].forEach(i => document.getElementById(i).style.display = 'none');
            ['trailer-section', 'backdrops-section', 'seasons-section', 'similar-section', 'providers-section']
                .forEach(i => document.getElementById(i).style.display = 'none');
            document.getElementById('trailer-iframe').src = '';
            document.getElementById('action-row').style.display = 'none';
            document.getElementById('not-in-base').style.display = 'block';

            const bottomBtn = document.getElementById('main-action-btn');
            bottomBtn.innerHTML = '⏳ Загрузка...';
            bottomBtn.disabled = true;

            try {
                const res = await fetch(`${API_URL}?action=tmdb_by_id&id=${encodeURIComponent(id)}&kind=${kind}&_t=${Date.now()}`);
                const data = JSON.parse(await res.text());

                if (data.ok && data.inBase) {
                    window.location.search = `?rowIndex=${data.rowIndex}&type=${data.type}`;
                    return;
                }
                if (!data.ok) throw new Error(data.error || "Нет данных");

                currentTmdb.title = data.title || title;
                currentTmdb.year = data.year || year;
                currentTmdb.countryRaw = data.countryRaw || "";

                document.title = currentTmdb.title;
                document.getElementById('poster').src = data.poster || 'https://via.placeholder.com/500x750?text=No+Poster';
                document.getElementById('title').textContent = currentTmdb.title;
                document.getElementById('originalTitle').textContent = data.originalTitle || '';
                document.getElementById('tagline').textContent = data.tagline ? `«${data.tagline}»` : '';

                let b = `<span class="badge">${kind === 'm' ? '🍿 Фильм' : '📺 Сериал'}</span>`;
                if (currentTmdb.year) b += `<span class="badge">📅 ${currentTmdb.year}</span>`;
                if (data.ratingTMDB) b += `<span class="badge gold">⭐ TMDB: ${data.ratingTMDB}</span>`;
                if (data.ratingKP) b += `<span class="badge red">⭐ КП: ${data.ratingKP}</span>`;
                b += `<span class="badge red">❌ Нет в базе</span>`;
                document.getElementById('badges-container').innerHTML = b;

                document.getElementById('country').textContent = data.country || "—";
                document.getElementById('genres').textContent = data.genres || "—";
                if (data.director) { document.getElementById('director').textContent = data.director; document.getElementById('director-row').style.display = 'flex'; }
                if (data.cast) { document.getElementById('cast').textContent = data.cast; document.getElementById('cast-row').style.display = 'flex'; }

                if (data.description) {
                    const d = document.getElementById('description');
                    d.textContent = data.description;
                    d.classList.add('collapsed');
                    document.getElementById('readMoreBtn').textContent = 'Читать далее';
                    document.getElementById('readMoreBtn').style.display = 'inline-block';
                } else {
                    document.getElementById('description').style.display = 'none';
                }

                if (data.trailer) {
                    const m = data.trailer.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&]{11})/);
                    if (m && m[1]) {
                        document.getElementById('trailer-iframe').src = `https://www.youtube.com/embed/${m[1]}`;
                        document.getElementById('trailer-section').style.display = 'block';
                    }
                }
            } catch (e) {
                console.error("loadTmdbCard:", e);
                document.getElementById('badges-container').innerHTML =
                    `<span class="badge">${kind === 'm' ? '🍿 Фильм' : '📺 Сериал'}</span>` +
                    (year ? `<span class="badge">📅 ${year}</span>` : '') +
                    `<span class="badge red">❌ Нет в базе</span>`;
                document.getElementById('description').textContent = 'Подробности временно недоступны, но вы можете оставить заявку.';
            }
            showRequestButton();
        }

        async function requestMovie() {
            const c = currentTmdb;
            if (!c) return;
            const btn = document.getElementById('main-action-btn');
            btn.disabled = true;
            btn.innerHTML = '⏳ Подготовка...';
            try {
                const q = JSON.stringify({ name: c.title, year: c.year || "", country: c.countryRaw || "" });
                const res = await fetch(`${API_URL}?action=save_query&q=${encodeURIComponent(q)}&_t=${Date.now()}`);
                const data = JSON.parse(await res.text());
                if (!(data.ok && data.id)) throw new Error("Не удалось сохранить запрос");
                const bot = String(botUsername).replace('@', '').trim() || "katxlog_bot";
                tg.openTelegramLink(`https://t.me/${bot}?start=${c.kind === 'm' ? 'reqm' : 'reqs'}_${data.id}`);
                setTimeout(() => { tg.close(); }, 500);
            } catch (e) {
                tg.showAlert("Ошибка: " + e.message);
            } finally {
                showRequestBtn();
            }
        }

        function closeApp() { tg.close(); }

        loadBasic();
    </script>
</body>
</html>
