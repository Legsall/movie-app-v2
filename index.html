<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Фильм</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1621;--card:rgba(30,41,59,.7);--muted:#94a3b8;--accent:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding-bottom:100px;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
.container{padding:0 16px;max-width:600px;margin:0 auto}
.hero{position:relative;max-height:55vh;margin-bottom:20px;border-radius:0 0 24px 24px;overflow:hidden;background:#1a2332}
.hero img{width:100%;display:block;object-fit:cover}
.hero:after{content:"";position:absolute;left:0;bottom:0;width:100%;height:40%;background:linear-gradient(to top,var(--bg),transparent);pointer-events:none}
h1{font-size:32px;font-weight:900;margin:0 0 4px;line-height:1.1;background:linear-gradient(to right,#fff,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.orig{font-size:14px;color:var(--muted);font-style:italic;margin-bottom:8px}
.tag{font-size:15px;color:#cbd5e1;font-style:italic;margin-bottom:16px;opacity:.8}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.badge{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;background:rgba(148,163,184,.15);color:#e2e8f0}
.b-type{background:rgba(59,130,246,.2);color:#93c5fd}
.b-tmdb{background:rgba(251,191,36,.15);color:var(--accent)}
.b-kp{background:rgba(239,68,68,.15);color:#f87171}
.row{display:flex;gap:10px;margin-bottom:24px}
button{font:inherit;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.95)}
.act{flex:1;padding:14px;border-radius:14px;font-size:15px;font-weight:700}
.share{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.watch{background:rgba(251,191,36,.15);color:var(--accent);border:1px solid rgba(251,191,36,.3)}
.card{display:flex;background:var(--card);border:1px solid rgba(255,255,255,.03);border-radius:16px;padding:14px 16px;margin-bottom:10px;font-size:14px;color:#e2e8f0}
.card b{min-width:110px;margin-right:8px;color:var(--muted);font-weight:500}
.card.desc{display:block;border-radius:20px;padding:20px;margin:14px 0 24px;font-size:15px;color:#cbd5e1}
.desc h3{margin:0 0 12px;font-size:16px;color:#fff}
.trailer{aspect-ratio:16/9;border-radius:20px;overflow:hidden;margin-bottom:24px;background:#000}
.trailer iframe{width:100%;height:100%;border:0}
h2{font-size:18px;font-weight:800;margin:0 0 12px}
.sim{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:24px}
.sim::-webkit-scrollbar{display:none}
.sim button{flex:0 0 110px;padding:0;border:0;background:none;color:#fff;text-align:left}
.sim img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;margin-bottom:6px;background:#1a2332}
.sim span{display:block;font-size:13px;font-weight:600}
.sim small{font-size:11px;color:var(--muted)}
.bar{position:fixed;left:0;bottom:0;width:100%;padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 60%,transparent);z-index:100}
.close{width:100%;padding:18px;border:0;border-radius:16px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#3b82f6,#2563eb)}
.msg{padding:80px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="app"><div class="msg">⏳ Загрузка…</div></div>
<div class="bar"><button class="close" id="close">Закрыть</button></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbx_lOo_ZblD870QKlBK2rI_bhr-REWavDL_txy6XToOCoC66Opbv7p0mJ33G1i_wiY95w/exec"; 

const tg = Telegram.WebApp;
tg.ready();
tg.expand();
try { tg.setHeaderColor("#0f1621"); tg.setBackgroundColor("#0f1621"); } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const openTg = url => tg.openTelegramLink ? tg.openTelegramLink(url) : (location.href = url);

$("close").onclick = () => tg.close();

const userId = tg.initDataUnsafe?.user?.id || "";
const p = new URLSearchParams(location.search);
const reqType = p.get("type") || "movie";
const reqIndex = p.get("rowIndex") || "";
let currentBot = "";

// 🚀 1. БЫСТРАЯ ЗАГРУЗКА (показываем карточку через 0.5 сек)
fetch(API + "?action=basic&type=" + reqType + "&rowIndex=" + reqIndex + "&userId=" + userId + "&t=" + Date.now())
  .then(r => r.json())
  .then(d => {
      if (d.ok) {
          renderBasic(d);
          // 🚀 2. ФОНОВАЯ ЗАГРУЗКА (подгружаем данные из TMDB и Кинопоиска)
          fetch(API + "?action=tmdb&type=" + reqType + "&rowIndex=" + reqIndex + "&t=" + Date.now())
            .then(r => r.json())
            .then(t => { if(t.ok) renderTmdb(t); })
            .catch(e => console.log("TMDB/KP error:", e));
      } else {
          fail(d.error);
      }
  })
  .catch((err) => fail("Ошибка: " + err.message));

function fail(m) {
  $("app").innerHTML = '<div class="msg">😔 ' + esc(m || "Не удалось загрузить данные") + "</div>";
}

function renderBasic(d) {
  document.title = d.title;
  currentBot = d.botUsername;
  const isMovie = d.type === "movie";
  const yt = (d.trailer.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/) || [])[1];
  const watchText = d.inWatchlist ? "🗑 Убрать из списка" : "📌 В список";

  $("app").innerHTML =
    (d.poster ? '<div class="hero"><img src="' + esc(d.poster) + '" alt=""></div>' : "") +
    '<div class="container">' +
    "<h1>" + esc(d.title) + "</h1>" +
    '<div id="tmdb-orig-title"></div>' +
    '<div id="tmdb-tagline"></div>' +
    '<div class="meta"><span class="badge b-type">' + (isMovie ? "🍿 Фильм" : "📺 Сериал") + "</span>" +
    (d.year ? '<span class="badge">📅 ' + esc(d.year) + "</span>" : "") +
    (d.ratingTMDB ? '<span class="badge b-tmdb">★ TMDB: ' + esc(d.ratingTMDB) + "</span>" : "") +
    (d.ratingKP ? '<span class="badge b-kp">★ КП: ' + esc(d.ratingKP) + "</span>" : "") + "</div>" +
    '<div class="row"><button class="act share" id="share">📤 Поделиться</button><button class="act watch" id="watch">' + watchText + '</button></div>' +
    '<div id="tmdb-cast-info"></div>' +
    (d.description ? '<div class="card desc"><h3>📝 О ' + (isMovie ? "фильме" : "сериале") + "</h3>" + esc(d.description) + "</div>" : "") +
    '<div id="tmdb-budget-info"></div>' +
    (yt ? ` <div class="trailer" style="display:flex; align-items:center; justify-content:center; position:relative; background:url(https://img.youtube.com/vi/${yt}/hqdefault.jpg) center/cover; cursor:pointer;" onclick="Telegram.WebApp.openLink('https://www.youtube.com/watch?v=${yt}')">     <div style="position:absolute; inset:0; background:rgba(0,0,0,0.5); border-radius:20px;"></div>     <div style="position:relative; z-index:10; text-align:center;">         <div style="width:60px; height:60px; background:#ff0000; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; box-shadow:0 4px 15px rgba(255,0,0,0.5);">             <svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>         </div>         <span style="color:white; font-weight:bold; font-size:14px; text-shadow:0 2px 4px rgba(0,0,0,0.8);">Смотреть трейлер</span>     </div> </div> ` : "") +
    '<div id="tmdb-similar-container"></div>' +
    "</div>";

  const shareLink = "https://t.me/" + d.botUsername + "?start=" + encodeURIComponent((isMovie ? "open_movie_" : "open_") + d.rowIndex);
  $("share").onclick = () => openTg("https://t.me/share/url?url=" + encodeURIComponent(shareLink) + "&text=" + encodeURIComponent("Смотри «" + d.title + "» в нашем боте!"));
  
  $("watch").onclick = async () => {
      const btn = $("watch");
      btn.disabled = true; 
      try {
          const res = await fetch(API + "?action=toggle_watch&rowIndex=" + d.rowIndex + "&type=" + d.type + "&userId=" + userId).then(r => r.json());
          if (res.ok) {
              if (res.status === "added") { btn.innerHTML = "🗑 Убрать из списка"; tg.showAlert("✅ Добавлено в список"); }
              else { btn.innerHTML = "📌 В список"; tg.showAlert("🗑 Удалено из списка"); }
          } else { tg.showAlert("❌ Ошибка списка"); }
      } catch (e) { tg.showAlert("❌ Ошибка сети"); }
      btn.disabled = false;
  };
}

// 🚀 ВСТАВКА ДАННЫХ ИЗ TMDB И КИНОПОИСКА (Плавно появляются)
function renderTmdb(t) {
    // 1. Оригинальное название
    if (t.originalTitle && t.originalTitle !== document.title) {
        $("tmdb-orig-title").innerHTML = '<div class="orig">' + esc(t.originalTitle) + "</div>";
    }
    
    // 2. Слоган фильма
    if (t.tagline) {
        $("tmdb-tagline").innerHTML = '<div class="tag">«' + esc(t.tagline) + "»</div>";
    }

    // 3. Режиссер и актеры
    const isMovie = reqType === "movie";
    let infoHtml = "";
    if (t.director) {
        infoHtml += '<div class="card"><b>' + (isMovie ? "🎬 Режиссёр:" : "🎬 Создатели:") + '</b><span>' + esc(t.director) + "</span></div>";
    }
    if (t.cast) {
        infoHtml += '<div class="card"><b>🎭 В ролях:</b><span>' + esc(t.cast) + "</span></div>";
    }
    $("tmdb-cast-info").innerHTML = infoHtml;

    // 4. Бюджет, Сборы и Доп. Информация
    let financeHtml = "";
    
    // Бюджет
    let budgetText = "Нет данных";
    if (t.budgetKP && t.budgetKP > 0) budgetText = "$" + Number(t.budgetKP).toLocaleString('ru-RU');
    else if (t.budget && t.budget > 0) budgetText = "$" + Number(t.budget).toLocaleString('ru-RU');
    financeHtml += '<div class="card" style="margin-top:-10px;"><b>💰 Бюджет:</b><span>' + budgetText + "</span></div>";

    // Сборы
    if (t.feesUSA > 0) financeHtml += '<div class="card" style="margin-top:-10px;"><b>🇺🇸 Сборы в США:</b><span>$' + Number(t.feesUSA).toLocaleString('ru-RU') + "</span></div>";
    if (t.feesRussia > 0) financeHtml += '<div class="card" style="margin-top:-10px;"><b>🇷🇺 Сборы в РФ:</b><span>$' + Number(t.feesRussia).toLocaleString('ru-RU') + "</span></div>";
    if (t.feesWorld > 0) financeHtml += '<div class="card" style="margin-top:-10px;"><b>🌍 Сборы в мире:</b><span>$' + Number(t.feesWorld).toLocaleString('ru-RU') + "</span></div>";

    // Премьеры и рейтинги
    if (t.premiereWorld) {
        let pDate = new Date(t.premiereWorld);
        if (!isNaN(pDate)) financeHtml += '<div class="card"><b>🌍 Премьера в мире:</b><span>' + pDate.toLocaleDateString('ru-RU') + "</span></div>";
    }
    if (t.premiereRussia) {
        let pDate = new Date(t.premiereRussia);
        if (!isNaN(pDate)) financeHtml += '<div class="card"><b>🇷🇺 Премьера в РФ:</b><span>' + pDate.toLocaleDateString('ru-RU') + "</span></div>";
    }
    if (t.ageRating) {
        financeHtml += '<div class="card"><b>🔞 Возраст:</b><span>' + esc(t.ageRating) + "</span></div>";
    }
    if (t.ratingMpaa) {
        financeHtml += '<div class="card"><b>🎬 Рейтинг MPAA:</b><span>' + esc(t.ratingMpaa) + "</span></div>";
    }

    $("tmdb-budget-info").innerHTML = financeHtml;

    // 5. Похожие фильмы (карусель)
    if (t.similar && t.similar.length > 0) {
        let simHtml = "<h2>🎬 Похожие</h2><div class=\"sim\">" + t.similar.map(s =>
            '<button data-id="' + esc(s.id) + '" data-k="' + esc(s.kind) + '"><img src="' + esc(s.poster) + '" alt=""><span>' + esc(s.title) + "</span><small>" + esc(s.year) + "</small></button>").join("") + "</div>";
        $("tmdb-similar-container").innerHTML = simHtml;
        
        // Привязываем кнопки к фильмам в карусели
        document.querySelectorAll(".sim button").forEach(b => {
            b.onclick = () => openTg("https://t.me/" + currentBot + "?start=" + encodeURIComponent("sim_" + b.dataset.id + "_" + b.dataset.k));
        });
    }
}
</script>
</body>
</html>
