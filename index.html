<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Загрузка…</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.themoviedb.org">
<link rel="preconnect" href="https://image.tmdb.org">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0a12;--plum:#1a1530;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--text:#f6f3ff;--hint:#a49fbd;--amber:#ffb347;--coral:#ff5d73;--ice:#8fd3ff;--r:22px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--text);font-family:Manrope,system-ui,sans-serif;overflow-x:hidden;padding-bottom:120px}
body.locked{overflow:hidden}
#ambient{position:fixed;inset:-10%;background:var(--plum) center/cover;filter:blur(70px) saturate(1.6);opacity:.55;transform:scale(1.2);z-index:-2;transition:background-image .6s}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(120% 60% at 50% 0,transparent,var(--ink) 75%),linear-gradient(transparent 40%,var(--ink));z-index:-1}
.skel{background:linear-gradient(90deg,#1a1530 25%,#2a2447 50%,#1a1530 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:var(--r)}
@keyframes sh{to{background-position:-200% 0}}
#skeleton{padding:70px 40px 0}
#app{display:none}
.close{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:50;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(11,10,18,.55);backdrop-filter:blur(12px);color:#fff;font-size:16px}

.stage{perspective:900px;padding:calc(64px + env(safe-area-inset-top)) 0 10px;display:flex;justify-content:center}
.card3d{position:relative;width:min(64vw,300px);aspect-ratio:2/3;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s ease-out;touch-action:pan-y}
.card3d img{width:100%;height:100%;object-fit:cover;border-radius:20px;display:block;box-shadow:0 2px 0 rgba(255,255,255,.25) inset,0 40px 70px -20px rgba(0,0,0,.9);background:var(--plum)}
.card3d::before{content:"";position:absolute;inset:0;border-radius:20px;transform:translateZ(-30px);background:var(--glow,#4a3b8f);filter:blur(34px);opacity:.7}
.glare{position:absolute;inset:0;border-radius:20px;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.4),transparent 55%);mix-blend-mode:soft-light;transform:translateZ(2px)}
.rings{position:absolute;left:50%;bottom:-26px;transform:translate(-50%,0) translateZ(60px);display:flex;gap:10px}
.ring{--p:0;--c:var(--amber);width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.12) 0);display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.6);position:relative}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:rgba(14,12,24,.92);backdrop-filter:blur(8px)}
.ring b{position:relative;font:800 15px Unbounded,sans-serif;line-height:1}
.ring small{position:relative;display:block;font-size:8px;color:var(--hint);text-align:center;margin-top:2px}
.ring span{position:relative;text-align:center}

.content{padding:46px 18px 0;max-width:640px;margin:0 auto}
h1{font:800 26px/1.15 Unbounded,sans-serif;text-align:center;letter-spacing:-.5px}
.orig,.tag{text-align:center;color:var(--hint);font-size:13px;margin-top:6px}
.tag{font-style:italic}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:16px 0}
.chip{padding:6px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;font-weight:600;backdrop-filter:blur(10px)}
.chip.hot{background:rgba(255,93,115,.16);border-color:rgba(255,93,115,.5);color:#ffb3bd}
.resume{display:none;width:100%;margin-bottom:14px;padding:15px;border:none;border-radius:18px;font:800 15px Manrope;color:#1b1000;background:linear-gradient(100deg,var(--amber),#ff8c5a);box-shadow:0 14px 30px -10px rgba(255,150,70,.7);align-items:center;justify-content:center;gap:10px}
.resume:active,.cta:active,.dock button:active{transform:scale(.97)}
.nobase{display:none;padding:14px 16px;border-radius:var(--r);border:1px solid rgba(255,93,115,.5);background:rgba(255,93,115,.1);margin-bottom:14px;font-size:14px;line-height:1.45}
.nobase span{color:var(--hint);font-size:13px}
.dock{display:flex;gap:10px;margin-bottom:18px}
.dock button{flex:1;padding:12px 6px;border-radius:18px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);color:var(--text);font:600 13px Manrope;display:flex;flex-direction:column;align-items:center;gap:5px;transition:.2s}
.dock button i{font-style:normal;font-size:20px}
.dock button.on{background:rgba(255,179,71,.16);border-color:var(--amber);color:var(--amber);box-shadow:0 0 22px -4px rgba(255,179,71,.6)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:18px;backdrop-filter:blur(16px)}
.row{display:flex;gap:12px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row>div:first-child{width:104px;flex-shrink:0;color:var(--hint)}
.row>div:last-child{flex:1;line-height:1.4}
h3{font:800 16px Unbounded,sans-serif;margin:24px 0 12px}
.desc{font-size:15px;line-height:1.6;color:#ddd8ee}
.desc.collapsed{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{color:var(--ice);font-weight:700;font-size:14px;margin-top:6px;display:inline-block}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:6px 18px 18px;margin:0 -18px;perspective:800px}
.hs::-webkit-scrollbar{display:none}
.hs img.bd{height:150px;border-radius:14px;scroll-snap-align:center;transform:rotateY(-6deg);box-shadow:0 14px 26px -8px #000;cursor:pointer;transition:transform .2s}
.hs img.bd:active{transform:rotateY(0) scale(.96)}
.sim{width:112px;flex-shrink:0;scroll-snap-align:start;transform:rotateY(-8deg);transform-origin:left;transition:transform .25s}
.sim:active{transform:rotateY(0) scale(.96)}
.sim img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:14px;box-shadow:0 14px 26px -8px #000;background:var(--plum)}
.sim p{font-size:12px;font-weight:700;margin-top:7px;line-height:1.25}
.sim small{color:var(--hint);font-size:11px}
.seasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.season{padding:14px 8px;border-radius:16px;text-align:center;background:linear-gradient(160deg,rgba(143,211,255,.18),rgba(255,255,255,.04));border:1px solid var(--line);cursor:pointer;transition:transform .2s,background .2s}
.season:active{transform:scale(.95)}
.season b{display:block;font:800 15px Unbounded,sans-serif;color:var(--ice)}
.season small{color:var(--hint);font-size:12px}
.season.dim{opacity:.45}
.prov{display:flex;gap:10px;flex-wrap:wrap}
.prov img{width:42px;height:42px;border-radius:12px}
.video{position:relative;padding-bottom:56.25%;border-radius:var(--r);overflow:hidden;box-shadow:0 20px 40px -14px #000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:30px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--ink) 55%)}
.cta{width:100%;max-width:640px;margin:0 auto;display:flex;padding:17px;border:none;border-radius:20px;font:800 16px Manrope;color:#fff;align-items:center;justify-content:center;gap:10px;background:linear-gradient(100deg,var(--coral),#b35cff);box-shadow:0 16px 36px -10px rgba(255,93,115,.75),0 1px 0 rgba(255,255,255,.4) inset;animation:pulse 2.8s infinite}
.cta:disabled{opacity:.55;animation:none}
@keyframes pulse{50%{box-shadow:0 16px 46px -6px rgba(179,92,255,.85),0 1px 0 rgba(255,255,255,.4) inset}}

#lb{position:fixed;inset:0;z-index:200;background:rgba(5,4,10,.96);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
#lb.open{opacity:1;pointer-events:auto}
#lb img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:14px;box-shadow:0 30px 70px -10px #000;transform:scale(.94);transition:transform .25s,opacity .2s}
#lb.open img{transform:scale(1)}
#lb img.swap{opacity:0}
.lb-x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font-size:17px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font-size:20px;backdrop-filter:blur(8px)}
.lb-nav.l{left:10px}.lb-nav.r{right:10px}
.lb-nav:active{background:rgba(255,255,255,.25)}
.lb-count{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:13px;color:var(--hint);font-weight:600}

#sheetBack{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .28s}
#sheetBack.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:160;max-width:640px;margin:0 auto;height:72vh;display:flex;flex-direction:column;background:rgba(22,18,40,.94);backdrop-filter:blur(26px) saturate(1.4);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -30px 60px -20px rgba(0,0,0,.8);transform:translateY(105%);transition:transform .32s cubic-bezier(.32,.72,0,1)}
#sheet.open{transform:translateY(0)}
.grab{width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);margin:10px auto 0}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 16px 12px}
.sheet-head h4{flex:1;text-align:center;font:800 15px Unbounded,sans-serif}
.sheet-head button{height:36px;min-width:36px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--text);font:700 13px Manrope}
.sheet-head button:active{transform:scale(.95)}
#sheetBackBtn.hide{visibility:hidden}
#sheetBody{flex:1;overflow-y:auto;padding:6px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:10px}
.ep{padding:15px 0;border-radius:16px;text-align:center;font:800 16px Unbounded,sans-serif;background:var(--glass);border:1px solid var(--line);color:var(--text);cursor:pointer;transition:transform .15s,background .15s}
.ep:active{transform:scale(.92);background:linear-gradient(100deg,var(--coral),#b35cff);border-color:transparent}
.ep.cur{background:rgba(255,179,71,.16);border-color:var(--amber);color:var(--amber);box-shadow:0 0 18px -4px rgba(255,179,71,.6)}
.empty{grid-column:1/-1;text-align:center;color:var(--hint);padding:30px 10px;font-size:14px}
.hint-cur{font-size:12px;color:var(--hint);text-align:center;margin-bottom:12px}

@media(prefers-reduced-motion:reduce){.cta{animation:none}.card3d{transition:none}#sheet,#lb,#lb img{transition:none}}
</style>
</head>
<body>
<div id="ambient"></div>
<button class="close" onclick="closeApp()" aria-label="Закрыть">✕</button>

<div id="skeleton"><div class="skel" style="aspect-ratio:2/3;max-width:260px;margin:0 auto 24px"></div><div class="skel" style="height:30px;width:70%;margin:0 auto 12px"></div><div class="skel" style="height:18px"></div></div>

<div id="app">
  <div class="stage">
    <div class="card3d" id="card">
      <img id="poster" alt="Постер">
      <div class="glare"></div>
      <div class="rings" id="rings"></div>
    </div>
  </div>

  <div class="content">
    <h1 id="title"></h1>
    <div class="orig" id="originalTitle"></div>
    <div class="tag" id="tagline"></div>
    <div class="chips" id="chips"></div>

    <button class="resume" id="continue-btn" onclick="continueWatching()">▶ <span id="continue-text">Продолжить просмотр</span></button>

    <div class="nobase" id="not-in-base">❌ <b>Этого нет в нашей базе.</b><br><span>Нажмите «Оставить заявку» внизу, и мы постараемся добавить.</span></div>

    <div class="dock" id="action-row">
      <button onclick="shareLink()"><i>📤</i>Поделиться</button>
      <button id="watchlist-btn" onclick="toggleWatchlist()"><i>📌</i><span>В список</span></button>
      <button id="notify-btn" onclick="toggleNotify()"><i>🔔</i><span>Уведомления</span></button>
    </div>

    <div class="panel">
      <div class="row"><div>Страна</div><div id="country">—</div></div>
      <div class="row"><div>Жанры</div><div id="genres">—</div></div>
      <div class="row" id="director-row"><div>Создатели</div><div id="director"></div></div>
      <div class="row" id="cast-row"><div>В ролях</div><div id="cast"></div></div>
      <div class="row" id="companies-row"><div>Студии</div><div id="companies"></div></div>
    </div>

    <div id="providers-container" style="display:none"><h3>Где смотреть</h3><div class="prov" id="providers"></div></div>

    <h3>О сюжете</h3>
    <div class="desc collapsed" id="description"></div>
    <span class="more" id="readMoreBtn" onclick="toggleReadMore()">Читать далее</span>

    <div id="backdrops-section" style="display:none"><h3>Кадры</h3><div class="hs" id="backdrops"></div></div>
    <div id="seasons-section" style="display:none"><h3>Сезоны</h3><div class="seasons" id="seasons"></div></div>
    <div id="trailer-section" style="display:none"><h3>Трейлер</h3><div class="video"><iframe id="trailer-iframe" allowfullscreen></iframe></div></div>
    <div id="similar-section" style="display:none"><h3>Похожие</h3><div class="hs" id="similar"></div></div>
  </div>

  <div class="bar"><button type="button" class="cta" id="main-action-btn" onclick="openInBot()">▶ Смотреть в боте</button></div>
</div>

<div id="lb">
  <button class="lb-x" onclick="closeLightbox()" aria-label="Закрыть">✕</button>
  <button class="lb-nav l" onclick="lbStep(-1,event)" aria-label="Назад">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav r" onclick="lbStep(1,event)" aria-label="Вперёд">›</button>
  <div class="lb-count" id="lbCount"></div>
</div>

<div id="sheetBack" onclick="closeSheet()"></div>
<div id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sheet-head">
    <button id="sheetBackBtn" class="hide" onclick="showSeasonList()">← Сезоны</button>
    <h4 id="sheetTitle">Сезоны</h4>
    <button onclick="closeSheet()" aria-label="Закрыть">✕</button>
  </div>
  <div id="sheetBody"></div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.expand();
try { tg.setHeaderColor('#0b0a12'); tg.setBackgroundColor('#0b0a12'); } catch(e){}
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const q = new URLSearchParams(location.search);
const rowIndex = q.get('rowIndex');
const type = q.get('type') || 'movie';
const API_URL = q.get('api') || "https://script.google.com/macros/s/AKfycbznYiEClrr5hBugCfF4TEGE5upb_uQJaxIbItsQklybzJ3B1ElAaxgC3mQ7dW1VbD28qA/exec";
const botUsername = q.get('bot') || "katxlog_bot";
const userId = tg.initDataUnsafe?.user?.id || q.get('uid') || "0";
let isInWatchlist = false, isMuted = false, currentTmdb = null, progressData = null;
let episodesList = [], seasonsData = [], frames = [], frameIdx = 0, sheetOpen = false, sheetView = 'seasons', lbOpen = false;

const TMDB_KEY = "ca153f9966020e101edec817d9a01699";
const RU = {US:"США",GB:"Великобритания",RU:"Россия",FR:"Франция",DE:"Германия",IT:"Италия",ES:"Испания",CA:"Канада",AU:"Австралия",JP:"Япония",KR:"Южная Корея",CN:"Китай",IN:"Индия",BR:"Бразилия",MX:"Мексика",TR:"Турция",UA:"Украина",BY:"Беларусь",KZ:"Казахстан",UZ:"Узбекистан",PL:"Польша",CZ:"Чехия",SE:"Швеция",NO:"Норвегия",DK:"Дания",FI:"Финляндия",NL:"Нидерланды",BE:"Бельгия",CH:"Швейцария",AT:"Австрия",IE:"Ирландия",PT:"Португалия",GR:"Греция",IL:"Израиль",TH:"Таиланд",NZ:"Новая Зеландия",HK:"Гонконг",TW:"Тайвань",AR:"Аргентина",ZA:"ЮАР",HU:"Венгрия",RO:"Румыния"};
const flag = iso => String(iso).toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0)));
const hap = (k,v) => { try { tg.HapticFeedback?.[k](v); } catch(e){} };

const card = $('card'); let touching = false, t0 = performance.now();
function tilt(x, y) {
  const r = card.getBoundingClientRect();
  const nx = Math.max(-1, Math.min(1, (x - r.left) / r.width * 2 - 1));
  const ny = Math.max(-1, Math.min(1, (y - r.top) / r.height * 2 - 1));
  card.style.setProperty('--ry', (nx * 18) + 'deg');
  card.style.setProperty('--rx', (-ny * 18) + 'deg');
  card.style.setProperty('--gx', (nx * 50 + 50) + '%');
  card.style.setProperty('--gy', (ny * 50 + 50) + '%');
}
['pointermove','pointerdown'].forEach(e => card.addEventListener(e, ev => { touching = true; tilt(ev.clientX, ev.clientY); }));
['pointerup','pointerleave','pointercancel'].forEach(e => card.addEventListener(e, () => { touching = false; }));
(function idle(t) {
  if (!touching) {
    const s = (t - t0) / 1000;
    card.style.setProperty('--ry', (Math.sin(s * .9) * 9) + 'deg');
    card.style.setProperty('--rx', (Math.cos(s * .7) * 5) + 'deg');
    card.style.setProperty('--gx', (50 + Math.sin(s * .9) * 40) + '%');
    card.style.setProperty('--gy', (20 + Math.cos(s * .7) * 20) + '%');
  }
  requestAnimationFrame(idle);
})(t0);

function setPoster(url) {
  const p = $('poster'); p.style.display = url ? 'block' : 'none'; p.src = url || '';
  $('ambient').style.backgroundImage = url ? `url("${url}")` : '';
  if (!url) return;
  const im = new Image(); im.crossOrigin = 'anonymous';
  im.onload = () => { try {
    const c = document.createElement('canvas'); c.width = c.height = 8;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0, 8, 8);
    const d = x.getImageData(0, 0, 8, 8).data; let r = 0, g = 0, b = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; b += d[i+2]; n++; }
    card.style.setProperty('--glow', `rgb(${r/n|0},${g/n|0},${b/n|0})`);
  } catch(e){} };
  im.src = url;
}
function ringHtml(label, val, color) {
  const n = parseFloat(String(val).replace(',', '.')); if (!n) return '';
  return `<div class="ring" style="--p:${Math.min(100, n * 10)};--c:${color}"><span><b>${n.toFixed(1)}</b><small>${label}</small></span></div>`;
}
function setRings(tm, kp) { $('rings').innerHTML = ringHtml('TMDB', tm, 'var(--amber)') + ringHtml('КП', kp, 'var(--coral)'); }
function chip(t, cls = '') { return `<span class="chip ${cls}">${esc(t)}</span>`; }
function setTrailer(url) {
  const m = (url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&]{11})/);
  if (m) { $('trailer-iframe').src = 'https://www.youtube.com/embed/' + m[1]; $('trailer-section').style.display = 'block'; }
}
function setDesc(t, empty) {
  const d = $('description'), b = $('readMoreBtn');
  if (t) { d.textContent = t; d.classList.add('collapsed'); d.style.display = 'block'; b.textContent = 'Читать далее'; b.style.display = 'inline-block'; }
  else { d.textContent = empty || ''; d.style.display = empty ? 'block' : 'none'; b.style.display = 'none'; }
}
function toggleReadMore() {
  const d = $('description'), b = $('readMoreBtn'), c = d.classList.toggle('collapsed');
  b.textContent = c ? 'Читать далее' : 'Скрыть';
}
function show() { $('skeleton').style.display = 'none'; $('app').style.display = 'block'; }

function syncBackButton() {
  try { (sheetOpen || lbOpen) ? tg.BackButton.show() : tg.BackButton.hide(); } catch(e){}
  document.body.classList.toggle('locked', sheetOpen || lbOpen);
}
try {
  tg.BackButton.onClick(() => {
    if (lbOpen) closeLightbox();
    else if (sheetOpen) { sheetView === 'episodes' && seasonsData.length > 1 ? showSeasonList() : closeSheet(); }
  });
} catch(e){}

function bigUrl(u) { return String(u).replace('/w780/', '/w1280/'); }
function openLightbox(i) {
  if (!frames.length) return;
  hap('impactOccurred', 'light');
  frameIdx = i; lbOpen = true;
  lbRender(false);
  $('lb').classList.add('open');
  syncBackButton();
}
function lbRender(anim) {
  const img = $('lbImg');
  const apply = () => {
    img.src = bigUrl(frames[frameIdx]);
    $('lbCount').textContent = `${frameIdx + 1} / ${frames.length}`;
    img.classList.remove('swap');
  };
  if (anim) { img.classList.add('swap'); setTimeout(apply, 120); } else apply();
  [frameIdx + 1, frameIdx - 1].forEach(j => { if (frames[j]) new Image().src = bigUrl(frames[j]); });
}
function lbStep(d, ev) {
  if (ev) ev.stopPropagation();
  if (frames.length < 2) return;
  hap('selectionChanged');
  frameIdx = (frameIdx + d + frames.length) % frames.length;
  lbRender(true);
}
function closeLightbox() {
  lbOpen = false;
  $('lb').classList.remove('open');
  syncBackButton();
}
(function(){
  const lb = $('lb'); let sx = 0, sy = 0;
  lb.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  lb.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) lbStep(dx < 0 ? 1 : -1);
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) closeLightbox();
  }, {passive:true});
  lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
})();

function epsInSeason(n) { return episodesList.filter(e => Number(e.season) === Number(n)); }
function buildSeasons(tmdbSeasons) {
  let list = (tmdbSeasons || []).map(s => ({ num: s.num, episodes: s.episodes }));
  if (!list.length && episodesList.length) {
    const nums = [...new Set(episodesList.map(e => Number(e.season)))].sort((a, b) => a - b);
    list = nums.map(n => ({ num: n, episodes: epsInSeason(n).length }));
  }
  return list;
}

    return `<div class="season${dim}" data-s="${s.num}"><b>Сезон ${s.num}</b><small>${s.episodes || have} сер.${have ? '' : (episodesList.length ? ' · нет в боте' : '')}</small></div>`;
  }).join('');
}

async function loadExtendedFast(title, year) {
  // Проверяем кэш браузера
  const cacheKey = `ext_${type}_${rowIndex}`;
  const cached = localStorage.getItem(cacheKey);
  if (cached) {
    try {
      const parsed = JSON.parse(cached);
      if (Date.now() - parsed.time < 86400000) { // Кэш на 24 часа
        renderExtended(parsed.data);
        return; // Мгновенная загрузка!
      }
    } catch(e){}
  }

  try {
    const kind = type === 'movie' ? 'movie' : 'tv';
    // 1. Ищем напрямую в TMDB по названию
    const searchTitle = String(title || '').replace(/\([^)]*\)/g, '').trim();
    const searchUrl = `https://api.themoviedb.org/3/search/${kind}?api_key=${TMDB_KEY}&language=ru-RU&query=${encodeURIComponent(searchTitle)}${year ? '&year=' + year : ''}`;
    let s = await (await fetch(searchUrl)).json();
    
    if (!s.results || !s.results.length) {
        s = await (await fetch(`https://api.themoviedb.org/3/search/${kind}?api_key=${TMDB_KEY}&language=ru-RU&query=${encodeURIComponent(searchTitle)}`)).json();
    }
    
    if (s.results && s.results.length) {
      const tmdbId = s.results[0].id;
      // 2. Получаем полные данные
      const append = "credits,similar,watch/providers,images" + (kind === "tv" ? ",seasons,content_ratings" : ",release_dates");
      const t = await (await fetch(`https://api.themoviedb.org/3/${kind}/${tmdbId}?api_key=${TMDB_KEY}&language=ru-RU&append_to_response=${append}`)).json();
      
      // 3. Парсим в наш формат
      const d = { ok: true, cast: "", director: "", similar: [], originalTitle: "", tagline: t.tagline || "", runtime: 0, status: t.status || "", premiereWorld: t.release_date || t.first_air_date || "", ageRating: "", watchProviders: [], companies: [], backdrops: [], seasons: [] };
      
      if (kind === "movie" && t.release_dates && t.release_dates.results) {
          const ru = t.release_dates.results.find(r => r.iso_3166_1 === "RU" && r.release_dates.some(rd => rd.certification));
          const us = t.release_dates.results.find(r => r.iso_3166_1 === "US" && r.release_dates.some(rd => rd.certification));
          if (ru) d.ageRating = ru.release_dates.find(rd => rd.certification).certification + "+";
          else if (us) d.ageRating = us.release_dates.find(rd => rd.certification).certification;
      } else if (kind === "tv" && t.content_ratings && t.content_ratings.results) {
          const ru = t.content_ratings.results.find(r => r.iso_3166_1 === "RU" && r.rating);
          const us = t.content_ratings.results.find(r => r.iso_3166_1 === "US" && r.rating);
          if (ru) d.ageRating = ru.rating + "+";
          else if (us) d.ageRating = us.rating;
      }

      const crew = (t.credits && t.credits.crew) || [], cast = (t.credits && t.credits.cast) || [];
      const dir = crew.find(x => x.job === "Director");
      d.originalTitle = t.original_title || t.original_name || "";
      d.director = kind === "movie" ? (dir ? dir.name : "") : (t.created_by || []).map(x => x.name).join(", ");
      d.cast = cast.slice(0, 10).map(x => x.name).join(", ");
      if (kind === "movie") d.runtime = t.runtime || 0; else d.runtime = (t.episode_run_time && t.episode_run_time.length > 0) ? t.episode_run_time[0] : 0;
      if (kind === "tv" && t.seasons) d.seasons = t.seasons.filter(s => s.season_number > 0).map(s => ({ name: s.name, num: s.season_number, episodes: s.episode_count, year: s.air_date ? s.air_date.substring(0, 4) : "" }));
      if (t.production_companies) d.companies = t.production_companies.map(c => c.name).slice(0, 3);
      if (t["watch/providers"] && t["watch/providers"].results) {
          const prov = t["watch/providers"].results.RU || t["watch/providers"].results.US;
          if (prov && prov.flatrate) d.watchProviders = prov.flatrate.map(p => ({ name: p.provider_name, logo: "https://image.tmdb.org/t/p/w200" + p.logo_path }));
      }
      if (t.images && t.images.backdrops) d.backdrops = t.images.backdrops.slice(0, 5).map(b => "https://image.tmdb.org/t/p/w780" + b.file_path);
      d.similar = ((t.similar && t.similar.results) || []).filter(x => x.poster_path).slice(0, 8).map(x => ({ id: x.id, kind: kind === "movie" ? "m" : "t", title: x.title || x.name || "", year: (x.release_date || x.first_air_date || "").substring(0, 4), poster: "https://image.tmdb.org/t/p/w200" + x.poster_path }));

      // Сохраняем в кэш
      localStorage.setItem(cacheKey, JSON.stringify({ time: Date.now(), data: d }));
      renderExtended(d);
      return;
    }
  } catch (e) {
    console.warn("Прямой запрос TMDB не удался, грузим через GAS", e);
  }

  // Fallback (если TMDB не ответил)
  try {
    const d = await (await fetch(`${API_URL}?action=tmdb&rowIndex=${rowIndex}&type=${type}&_t=${Date.now()}`)).json();
    if (d.ok) renderExtended(d);
  } catch(e) {}
}

function renderExtended(d) {
    if (d.originalTitle) $('originalTitle').textContent = d.originalTitle;
    if (d.tagline) $('tagline').textContent = `«${d.tagline}»`;
    let c = '';
    if (d.status) c += chip('🚦 ' + (d.status === "Ended" ? "Завершён" : d.status === "Returning Series" ? "Идёт показ" : d.status));
    if (d.runtime > 0) { const h = Math.floor(d.runtime / 60), m = d.runtime % 60; c += chip('⏱ ' + (h > 0 ? `${h} ч ${m} мин` : `${m} мин`)); }
    if (d.ageRating) c += chip(d.ageRating, 'hot');
    if (d.premiereWorld) c += chip('🗓 ' + new Date(d.premiereWorld).toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'}));
    // Очищаем старые бейджи перед добавлением
    const chips = $('chips').innerHTML.split('<span class="chip')[0];
    $('chips').innerHTML = chips + c;

    const fill = (id, rowId, v) => { if (v) { $(id).textContent = v; $(rowId).style.display = 'flex'; } else { $(rowId).style.display = 'none'; } };
    fill('director', 'director-row', d.director);
    fill('cast', 'cast-row', d.cast);
    fill('companies', 'companies-row', (d.companies || []).join(', '));

    if (d.watchProviders && d.watchProviders.length) {
      $('providers-container').style.display = 'block';
      $('providers').innerHTML = d.watchProviders.map(p => `<img src="${esc(p.logo)}" title="${esc(p.name)}" alt="${esc(p.name)}">`).join('');
    }
    if (d.backdrops && d.backdrops.length) {
      frames = d.backdrops;
      $('backdrops-section').style.display = 'block';
      $('backdrops').innerHTML = frames.map((b, i) => `<img class="bd" data-i="${i}" src="${esc(b)}" alt="Кадр ${i + 1}" loading="lazy">`).join('');
      $('backdrops').onclick = ev => { const el = ev.target.closest('.bd'); if (el) openLightbox(+el.dataset.i); };
    }
    if (type === 'series') {
      seasonsData = buildSeasons(d.seasons);
      if (seasonsData.length) {
        $('seasons-section').style.display = 'block';
        renderSeasonCards($('seasons'));
        $('seasons').onclick = ev => { const el = ev.target.closest('.season'); if (el) openSeasonFromPage(+el.dataset.s); };
      }
    }
    if (d.similar && d.similar.length) {
      $('similar-section').style.display = 'block';
      $('similar').innerHTML = d.similar.map((m, i) => `<div class="sim" data-i="${i}"><img src="${esc(m.poster)}" alt=""><p>${esc(m.title)}</p><small>${esc(m.year)}</small></div>`).join('');
      $('similar').onclick = ev => {
        const el = ev.target.closest('.sim'); if (!el) return;
        const m = d.similar[+el.dataset.i];
        openSimilar(m.id, m.kind, m.rowIndex || 0, m.title, m.year || '');
      };
    }
}

async function fetchTmdbDirect(id, kind) {
  const k = kind === 'm' ? 'movie' : 'tv';
  const base = `https://api.themoviedb.org/3/${k}/${id}?api_key=${TMDB_KEY}`;
  const t = await (await fetch(base + "&language=ru-RU&append_to_response=videos,credits&include_video_language=ru,en,null")).json();
  if (!t || !t.id) throw new Error(t && t.status_message ? t.status_message : "TMDB: нет данных");
  let description = t.overview || "";
  if (!description) { try { description = (await (await fetch(base + "&language=en-US")).json()).overview || ""; } catch(e){} }
  let iso = (t.production_countries || []).map(c => c.iso_3166_1);
  if (!iso.length) iso = t.origin_country || [];
  const vid = ((t.videos && t.videos.results) || []).find(v => v.site === "YouTube" && (v.type === "Trailer" || v.type === "Teaser"));
  const crew = (t.credits && t.credits.crew) || [];
  return {
    ok: true, title: t.title || t.name || "", originalTitle: t.original_title || t.original_name || "", tagline: t.tagline || "",
    year: (t.release_date || t.first_air_date || "").substring(0, 4),
    poster: t.poster_path ? "https://image.tmdb.org/t/p/w500" + t.poster_path : "",
    country: iso.map(i => flag(i) + " " + (RU[i] || i)).join(", "), countryRaw: iso.map(i => RU[i] || i).join(", "),
    genres: (t.genres || []).map(g => g.name).join(", "), description,
    trailer: vid ? "https://www.youtube.com/watch?v=" + vid.key : "",
    ratingTMDB: t.vote_average ? String(Math.round(t.vote_average * 10) / 10) : "", ratingKP: "",
    cast: ((t.credits && t.credits.cast) || []).slice(0, 10).map(c => c.name).join(", "),
    director: k === 'movie' ? ((crew.find(c => c.job === "Director") || {}).name || "") : (t.created_by || []).map(c => c.name).join(", ")
  };
}

async function requestMovie() {
    const c = currentTmdb;
    if (!c) return;
    const btn = document.getElementById('main-action-btn');
    btn.disabled = true;
    btn.innerHTML = '⏳ Отправка...';

    try {
        const tgUser = tg.initDataUnsafe?.user || {};
        const firstName = tgUser.first_name || "Пользователь";
        const username = tgUser.username || "";
        const userId = tgUser.id || "0";
        const typeStr = c.kind === 'm' ? 'movie' : 'series';
        
        const url = `${API_URL}?action=create_request&title=${encodeURIComponent(c.title)}&year=${encodeURIComponent(c.year || "")}&country=${encodeURIComponent(c.countryRaw || "")}&type=${typeStr}&userId=${userId}&firstName=${encodeURIComponent(firstName)}&username=${encodeURIComponent(username)}&_t=${Date.now()}`;
        
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.ok) {
            tg.showAlert("✅ Заявка успешно отправлена! Админ получил уведомление.");
            setTimeout(() => { tg.close(); }, 2500);
        } else {
            throw new Error(data.error || "Ошибка сервера");
        }
    } catch(e) {
        tg.showAlert("❌ Ошибка: " + e.message);
        btn.disabled = false;
        btn.innerHTML = `📩 Оставить заявку`;
    }
}

function closeApp() { tg.close(); }
loadBasic();
</script>
</body>
</html>
