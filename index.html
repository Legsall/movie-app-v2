<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Фильм</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1621;--card:rgba(30,41,59,.7);--muted:#94a3b8;--accent:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding-bottom:100px;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
.container{padding:0 16px;max-width:600px;margin:0 auto}
.hero{position:relative;max-height:55vh;margin-bottom:20px;border-radius:0 0 24px 24px;overflow:hidden;background:#1a2332}
.hero img{width:100%;display:block;object-fit:cover}
.hero:after{content:"";position:absolute;left:0;bottom:0;width:100%;height:40%;background:linear-gradient(to top,var(--bg),transparent);pointer-events:none}
h1{font-size:32px;font-weight:900;margin:0 0 4px;line-height:1.1;background:linear-gradient(to right,#fff,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.orig{font-size:14px;color:var(--muted);font-style:italic;margin-bottom:8px}
.tag{font-size:15px;color:#cbd5e1;font-style:italic;margin-bottom:16px;opacity:.8}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.badge{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;background:rgba(148,163,184,.15);color:#e2e8f0}
.b-type{background:rgba(59,130,246,.2);color:#93c5fd}
.b-tmdb{background:rgba(251,191,36,.15);color:var(--accent)}
.b-kp{background:rgba(239,68,68,.15);color:#f87171}
.row{display:flex;gap:10px;margin-bottom:24px}
button{font:inherit;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.95)}
.act{flex:1;padding:14px;border-radius:14px;font-size:15px;font-weight:700}
.share{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.watch{background:rgba(251,191,36,.15);color:var(--accent);border:1px solid rgba(251,191,36,.3)}
.card{display:flex;background:var(--card);border:1px solid rgba(255,255,255,.03);border-radius:16px;padding:14px 16px;margin-bottom:10px;font-size:14px;color:#e2e8f0}
.card b{min-width:110px;margin-right:8px;color:var(--muted);font-weight:500}
.card.desc{display:block;border-radius:20px;padding:20px;margin:14px 0 24px;font-size:15px;color:#cbd5e1}
.desc h3{margin:0 0 12px;font-size:16px;color:#fff}
.trailer{aspect-ratio:16/9;border-radius:20px;overflow:hidden;margin-bottom:24px;background:#000}
.trailer iframe{width:100%;height:100%;border:0}
h2{font-size:18px;font-weight:800;margin:0 0 12px}
.sim{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:24px}
.sim::-webkit-scrollbar{display:none}
.sim button{flex:0 0 110px;padding:0;border:0;background:none;color:#fff;text-align:left}
.sim img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;margin-bottom:6px;background:#1a2332}
.sim span{display:block;font-size:13px;font-weight:600}
.sim small{font-size:11px;color:var(--muted)}
.bar{position:fixed;left:0;bottom:0;width:100%;padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 60%,transparent);z-index:100}
.close{width:100%;padding:18px;border:0;border-radius:16px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#3b82f6,#2563eb)}
.msg{padding:80px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="app"><div class="msg">⏳ Загрузка…</div></div>
<div class="bar"><button class="close" id="close">Закрыть</button></div>

<script>
// ⚠️ Вставьте сюда адрес вашего веб-приложения Apps Script (заканчивается на /exec)
const API = "ВСТАВЬТЕ_СЮДА_ВАШ_EXEC_URL";

const tg = Telegram.WebApp;
tg.ready();
tg.expand();
try { tg.setHeaderColor("#0f1621"); tg.setBackgroundColor("#0f1621"); } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const openTg = url => tg.openTelegramLink ? tg.openTelegramLink(url) : (location.href = url);

$("close").onclick = () => tg.close();

const p = new URLSearchParams(location.search);
fetch(API + "?type=" + encodeURIComponent(p.get("type") || "movie") + "&rowIndex=" + encodeURIComponent(p.get("rowIndex") || ""))
  .then(r => r.json())
  .then(d => d.ok ? render(d) : fail(d.error))
  .catch(() => fail());

function fail(m) {
  $("app").innerHTML = '<div class="msg">😔 ' + esc(m || "Не удалось загрузить данные") + "</div>";
}

function render(d) {
  document.title = d.title;
  const isMovie = d.type === "movie", bot = d.botUsername;
  const yt = (d.trailer.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/) || [])[1];
  const info = [[isMovie ? "🎬 Режиссёр:" : "🎬 Создатели:", d.director], ["🎭 В ролях:", d.cast], ["🌍 Страна:", d.country], ["🎭 Жанр:", d.genres]]
    .filter(x => x[1]).map(x => '<div class="card"><b>' + x[0] + "</b><span>" + esc(x[1]) + "</span></div>").join("");

  $("app").innerHTML =
    (d.poster ? '<div class="hero"><img src="' + esc(d.poster) + '" alt=""></div>' : "") +
    '<div class="container">' +
    "<h1>" + esc(d.title) + "</h1>" +
    (d.originalTitle && d.originalTitle !== d.title ? '<div class="orig">' + esc(d.originalTitle) + "</div>" : "") +
    (d.tagline ? '<div class="tag">«' + esc(d.tagline) + "»</div>" : "") +
    '<div class="meta"><span class="badge b-type">' + (isMovie ? "🍿 Фильм" : "📺 Сериал") + "</span>" +
    (d.year ? '<span class="badge">📅 ' + esc(d.year) + "</span>" : "") +
    (d.ratingTMDB ? '<span class="badge b-tmdb">★ TMDB: ' + esc(d.ratingTMDB) + "</span>" : "") +
    (d.ratingKP ? '<span class="badge b-kp">★ КП: ' + esc(d.ratingKP) + "</span>" : "") + "</div>" +
    '<div class="row"><button class="act share" id="share">📤 Поделиться</button><button class="act watch" id="watch">📌 В список</button></div>' +
    info +
    (d.description ? '<div class="card desc"><h3>📝 О ' + (isMovie ? "фильме" : "сериале") + "</h3>" + esc(d.description) + "</div>" : "") +
    (yt ? '<div class="trailer"><iframe src="https://www.youtube.com/embed/' + yt + '" allowfullscreen></iframe></div>' : "") +
    (d.similar.length ? "<h2>🎬 Похожие</h2><div class=\"sim\">" + d.similar.map(s =>
      '<button data-id="' + esc(s.id) + '" data-k="' + esc(s.kind) + '"><img src="' + esc(s.poster) + '" alt=""><span>' + esc(s.title) + "</span><small>" + esc(s.year) + "</small></button>").join("") + "</div>" : "") +
    "</div>";

  const shareLink = "https://t.me/" + bot + "?start=" + (isMovie ? "open_movie_" : "open_") + d.rowIndex;
  $("share").onclick = () => openTg("https://t.me/share/url?url=" + encodeURIComponent(shareLink) + "&text=" + encodeURIComponent("Смотри «" + d.title + "» в нашем боте!"));
  $("watch").onclick = () => openTg("https://t.me/" + bot + "?start=watch_" + d.rowIndex + "_" + d.type);
  document.querySelectorAll(".sim button").forEach(b => {
    b.onclick = () => openTg("https://t.me/" + bot + "?start=sim_" + b.dataset.id + "_" + b.dataset.k);
  });
}
</script>
</body>
</html>
